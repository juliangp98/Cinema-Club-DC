# Cinema Club DC — Docker Compose for Synology NAS
#
# Deployment steps:
#   1. Copy this project to your Synology NAS
#   2. Copy .env.production.example to .env.production and fill in values
#   3. Run: docker-compose up -d --build
#   4. Access at http://<NAS-IP>:8080
#
# Custom domain setup:
#   - Synology Control Panel → Login Portal → Advanced → Reverse Proxy
#   - Source: https://your-domain.com:443 → Destination: localhost:8080
#   - For external access: set up Cloudflare Tunnel or Synology DDNS
#
# Scraper (run manually or via Synology Task Scheduler):
#   docker exec cinemaclub-backend python scraper.py
# Suns announces films before tickets go on sale; check it every 30 minutes too
# so on-sale alerts go out quickly (a second Task Scheduler entry):
#   docker exec cinemaclub-backend python scraper.py --only suns

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cinemaclub-backend
    env_file: .env.production
    # Names: straight to the router, then the caching resolver, skipping
    # Docker's own forwarder (it failed 1 lookup in 5 on the NAS). The backend
    # only looks up outside names, so it doesn't need Docker's. See
    # dns/resolv.backend.conf and the note on `dns`.
    networks:
      - default
      - lookups
    depends_on:
      - dns
    volumes:
      - db-data:/app/instance
      - ./dns/resolv.backend.conf:/etc/resolv.conf:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cinemaclub-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Discord bot — announces schedule drops to #movies and serves slash
  # commands. Talks to the backend over the internal Docker network only.
  # Requires DISCORD_BOT_TOKEN / DISCORD_CHANNEL_ID / INTERNAL_API_TOKEN in
  # .env.production. Slash commands sync globally — no guild ID needed.
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: cinemaclub-bot
    env_file: .env.production
    environment:
      - BOT_API_BASE=http://backend:5001
      # Unbuffered stdout so the bot's own print() diagnostics (e.g. "chatbot
      # reply failed: ...") actually reach `docker-compose logs` instead of
      # sitting in Python's block buffer until the process exits.
      - PYTHONUNBUFFERED=1
    # Names: the caching resolver first, then the router (see `dns`). Docker
    # still resolves the internal `backend` hostname regardless of this.
    dns:
      - 172.29.53.53
      - 192.168.0.1
    networks:
      - default
      - lookups
    depends_on:
      - dns
      - backend
    restart: unless-stopped

  # The caching DNS resolver (Dockerfile.dns, dns/unbound.conf.in). History:
  # Docker's embedded resolver once stopped forwarding on this NAS, so the
  # containers were pinned to the LAN router (192.168.0.1; 8.8.8.8 is blocked
  # by outbound-port-53 filtering). The router then failed about 1 lookup in
  # 6 ("Temporary failure in name resolution": sign-in emails, TMDB, the AI).
  # This asks the router and keeps the answers; when the router fails, a name
  # it has seen is answered from the cache, even expired. It sits at a fixed
  # address (dns: needs an IP) on its own small network, `lookups`, which the
  # backend and bot also join; the project's default network stays as it was.
  dns:
    build:
      context: .
      dockerfile: Dockerfile.dns
    container_name: cinemaclub-dns
    environment:
      - DNS_UPSTREAM=192.168.0.1
    networks:
      lookups:
        ipv4_address: 172.29.53.53
    restart: unless-stopped

networks:
  lookups:                            # the resolver's own network: a fixed range, so its address can be fixed
    ipam:
      config:
        - subnet: 172.29.53.0/24

volumes:
  db-data:
    driver: local

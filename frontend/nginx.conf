# Link-preview crawlers (Discord, Slack, iMessage, …) get a small page of
# Open Graph tags for film and screening links, served by the backend
# (/api/og/…); people get the single-page app as usual.
map $http_user_agent $og_bot {
    default 0;
    "~*(discordbot|slackbot|twitterbot|facebookexternalhit|whatsapp|telegrambot|linkedinbot|embedly|skypeuripreview|applebot|iframely|redditbot|mastodon)" 1;
}
map "$og_bot:$arg_showtime" $og_showtime {
    default "";
    "~^1:(?<id>[0-9]+)$" $id;
}

# Rate limits for the API, now that the schedule is public (R5a). Keyed on
# the visitor's real address: Cloudflare's tunnel sends it as CF-Connecting-IP
# (nginx itself only sees the tunnel); on the LAN there's no tunnel.
map $http_cf_connecting_ip $client_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $client_key zone=api:10m rate=15r/s;
limit_req_zone $client_key zone=signin:10m rate=6r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Public, but kept out of search engines until the public site is finished
    # (R5). Link previews (Discord, Slack…) still work: they don't index.
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_req_status 429;

    # Sign-in links and sign-up: a tighter limit (the backend also caps
    # links per address and per email).
    location ~ ^/api/auth/(login|signup)$ {
        limit_req zone=signin burst=5 nodelay;
        proxy_pass http://backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to the Flask backend
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Film pages: preview card for crawlers
    location ~ ^/films/([0-9]+)/?$ {
        if ($og_bot) {
            rewrite ^/films/([0-9]+)/?$ /api/og/films/$1 last;
        }
        try_files $uri /index.html;
    }

    # Screening links (/calendar?showtime=<id>, and the older /?showtime=<id>)
    location = /calendar {
        if ($og_showtime) {
            rewrite ^ /api/og/showtimes/$og_showtime? last;
        }
        try_files $uri /index.html;
    }
    location = / {
        if ($og_showtime) {
            rewrite ^ /api/og/showtimes/$og_showtime? last;
        }
        try_files $uri /index.html;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

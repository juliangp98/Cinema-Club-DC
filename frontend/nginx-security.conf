# Browser protections for every response (R9d). Included in the server block
# and again in each location that sets its own headers (nginx drops the
# server's add_header lines in a location that has any of its own).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Robots-Tag $robots_tag always;

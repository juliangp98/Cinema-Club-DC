<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f070c" />
    <link rel="icon" href="/pwa-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%SITE_NAME% — repertory and independent film in DC</title>
    <meta name="description" content="Every screening at the DC area's independent and repertory theatres — AFI, Suns, Alamo, the Smithsonian and more — film prints, Q&amp;As and one-night-only shows, in one place." />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%SITE_NAME%" />
    <meta property="og:description" content="Every screening at the DC area's independent and repertory theatres, in one place." />
    <meta property="og:image" content="/pwa-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Start-up check (R7b): if the app hasn't started 12 seconds after the
      // page loads, or one of its files fails to arrive, offer a clean reload
      // instead of leaving a blank page.
      (function () {
        var shown = false;
        function offer() {
          if (shown || window.__appStarted) return;
          shown = true;
          var root = document.getElementById('root');
          root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem;text-align:center;background:#1f070c;color:#f3e7d3;font-family:system-ui,sans-serif">'
            + '<strong style="color:#dcb15c;font-size:1.4rem">%SITE_NAME%</strong>'
            + '<p style="max-width:28rem;margin:0">The site didn\'t finish loading. This usually fixes it:</p>'
            + '<button id="boot-reload" style="padding:.6rem 1.4rem;border-radius:999px;border:0;background:#dcb15c;color:#1f070c;font-weight:700;cursor:pointer">Reload</button></div>';
          document.getElementById('boot-reload').onclick = function () {
            var done = function () { location.reload(); };
            try {
              var jobs = [];
              if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
              }
              if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
              Promise.all(jobs).then(done, done);
            } catch (e) { done(); }
          };
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && t.rel === 'stylesheet'))) offer();
        }, true);
        window.addEventListener('load', function () { setTimeout(offer, 12000); });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

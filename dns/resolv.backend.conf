# The backend's name lookups (mounted as its /etc/resolv.conf by
# docker-compose.yml). They skip Docker's own DNS forwarder (127.0.0.11): on
# the NAS that forwarder failed about 1 lookup in 5, while the router answered
# every time and the caching resolver nearly always (account_check.py --dns).
# The backend only ever looks up outside names (Gmail, TMDB, OMDb, the AI,
# theatres' sites), so it doesn't need Docker's names for the other containers.
# The router first; the caching resolver if the router doesn't answer.
nameserver 192.168.0.1
nameserver 172.29.53.53
options timeout:2 attempts:3
